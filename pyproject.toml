[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "briq"
version = "0.3.0"
description = "Python client for the Briq messaging platform API"
readme = "README.md"
authors = [
    {name = "Briq Team", email = "info@briq.tz"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Communications :: Telephony",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = ["briq", "sms", "email", "whatsapp", "messaging", "otp", "voice", "api", "client"]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.25.0",
    "python-dotenv>=0.15.0",
]

[project.urls]
"Homepage" = "https://github.com/BRIQ-BLOCK/BriqPythonSdk"
"Documentation" = "https://docs.briq.tz"
"Bug Tracker" = "https://github.com/BRIQ-BLOCK/BriqPythonSdk/issues"
"Changelog" = "https://github.com/BRIQ-BLOCK/BriqPythonSdk/blob/main/CHANGELOG.md"
"Source" = "https://github.com/BRIQ-BLOCK/BriqPythonSdk"

[dependency-groups]
dev = [
    "mypy>=1.4.1",
    "pytest>=7.4.4",
    "pytest-cov>=4.1.0",
    "ruff>=0.15.11",
    "types-requests>=2.31.0.20231231",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["briq"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 60

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict = false
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
